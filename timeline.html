<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="landing" data-lang="it">

  <header class="topbar">
    <button class="brand" id="brandBtn" type="button" aria-label="Torna alla Timeline">
      <span class="seal seal--mini" aria-hidden="true">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#22d3ee"/>
              <stop offset="55%" stop-color="#e879f9"/>
              <stop offset="100%" stop-color="#fb923c"/>
            </linearGradient>
          </defs>
          <polygon points="16,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5" fill="none" stroke="url(#brandGrad)" stroke-width="2.4"/>
          <circle cx="16" cy="16" r="4.5" fill="url(#brandGrad)"/>
        </svg>
      </span>
      <span class="brand-text" data-i18n="brand">Timeline</span>
    </button>

    <div class="topbar-controls">
      <div class="universe-picker" id="universePicker" hidden>
        <button class="universe-trigger" id="universeTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="universeTriggerLabel">—</span>
          <svg viewBox="0 0 12 8" class="chevron" aria-hidden="true"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="universe-menu" id="universeMenu" role="listbox" hidden></ul>
      </div>

      <button class="lang-switch" id="langSwitch" type="button" aria-label="Cambia lingua / Change language">
        <span class="lang-option is-active" data-lang-option="it">IT</span>
        <span class="lang-sep">/</span>
        <span class="lang-option" data-lang-option="en">EN</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <p class="sidebar-eyebrow" data-i18n="sidebarEyebrow">Libreria Timeline</p>
      <ul class="game-list" id="gameList"></ul>
      <p class="sidebar-note" data-i18n="sidebarNote">— altri titoli in arrivo —</p>

      <div class="sidebar-group" aria-disabled="true">
        <p class="sidebar-group__label">Film / Serie TV</p>
      </div>
      <div class="sidebar-group" aria-disabled="true">
        <p class="sidebar-group__label">Libri / Letteratura</p>
      </div>
      <div class="sidebar-group" aria-disabled="true">
        <p class="sidebar-group__label">Anime / Manga</p>
      </div>
    </aside>

    <main class="stage" id="stage">

      <section class="landing" id="landingPanel">
        <p class="landing-eyebrow" data-i18n="landingEyebrow">Benvenuto nell'archivio</p>
        <h1 class="landing-title" data-i18n="landingTitle">Scegli un fascicolo</h1>
        <p class="landing-sub" data-i18n="landingSub">Ogni titolo custodisce una o più linee temporali. Selezionane uno per aprirlo.</p>
        <div class="case-grid" id="caseGrid"></div>
      </section>

      <section class="game-panel" id="gamePanel" hidden>
        <div class="game-header" id="gameHeader"></div>
        <div class="universes-row" id="universesRow"></div>
      </section>

      <section class="title-panel" id="titlePanel" hidden>
        <div class="title-content" id="titleContent"></div>
      </section>

    </main>

    <aside class="timeline-rail" id="timelineRail" hidden>
      <p class="rail-label" id="railLabel"></p>
      <div class="rail-track" id="railTrack"></div>
    </aside>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
