<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="landing" data-lang="it">

  <button class="mobile-topbar__hamburger" id="mobileMenuBtn" type="button" aria-label="Apri il menu dei titoli" aria-expanded="false">
    <span class="mobile-topbar__hamburger-lines"></span>
  </button>
  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="brand" id="brandBtn" type="button" aria-label="Torna alla Timeline">
        <span class="seal seal--mini" aria-hidden="true">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#22d3ee"/>
                <stop offset="55%" stop-color="#e879f9"/>
                <stop offset="100%" stop-color="#fb923c"/>
              </linearGradient>
            </defs>
            <polygon points="16,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5" fill="none" stroke="url(#brandGrad)" stroke-width="2.4"/>
            <circle cx="16" cy="16" r="4.5" fill="url(#brandGrad)"/>
          </svg>
        </span>
        <span class="brand-text" data-i18n="brand">Timeline</span>
      </button>

      <p class="sidebar-eyebrow" data-i18n="sidebarEyebrow">Libreria Timeline</p>
      <ul class="game-list" id="gameList"></ul>
    </aside>

    <main class="stage" id="stage">

      <div class="stage-controls">
        <div class="music-control" id="musicControl">
          <span class="track-info" id="trackInfo" hidden>
            <span class="track-info__text">
              <span class="track-info__title" id="trackTitle"></span>
              <span class="track-info__game" id="trackGame"></span>
            </span>
            <button class="track-skip" id="trackSkipBtn" type="button" aria-label="Prossimo brano">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l7 5-7 5V3z" fill="currentColor"/><rect x="11" y="3" width="2" height="10" fill="currentColor"/></svg>
            </button>
          </span>

          <div class="volume-control" id="volumeControl">
            <button class="music-toggle" id="musicToggle" type="button" aria-label="Attiva/disattiva musica" aria-pressed="false" hidden>
              <svg class="music-toggle__icon-on" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8v4h3l4 4V4L7 8H4z" fill="currentColor"/><path d="M14 7c1 .8 1 5.2 0 6M16.2 5c2 1.6 2 8.4 0 10" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
              <svg class="music-toggle__icon-off" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8v4h3l4 4V4L7 8H4z" fill="currentColor"/><path d="M13 7l5 6M18 7l-5 6" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
            </button>

            <div class="volume-panel" id="volumePanel">
              <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7" orient="vertical" aria-label="Volume">
            </div>
          </div>
        </div>

        <div class="universe-picker" id="universePicker" hidden>
          <button class="universe-trigger" id="universeTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="universeTriggerLabel">—</span>
            <svg viewBox="0 0 12 8" class="chevron" aria-hidden="true"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="universe-menu" id="universeMenu" role="listbox" hidden></ul>
        </div>

        <button class="lang-switch" id="langSwitch" type="button" aria-label="Cambia lingua / Change language">
          <span class="lang-option is-active" data-lang-option="it">IT</span>
          <span class="lang-sep">/</span>
          <span class="lang-option" data-lang-option="en">EN</span>
        </button>
      </div>

      <audio id="bgMusic" preload="none"></audio>

      <section class="landing" id="landingPanel">
        <p class="landing-eyebrow" data-i18n="landingEyebrow">Benvenuto nell'archivio</p>
        <h1 class="landing-title" data-i18n="landingTitle">Scegli un fascicolo</h1>
        <p class="landing-sub" data-i18n="landingSub">Ogni titolo custodisce una o più linee temporali. Selezionane uno per aprirlo.</p>
        <div class="case-grid" id="caseGrid"></div>
      </section>

      <section class="game-panel" id="gamePanel" hidden>
        <div class="game-header" id="gameHeader"></div>
        <div class="universes-row" id="universesRow"></div>
      </section>

      <section class="title-panel" id="titlePanel" hidden>
        <div class="title-content" id="titleContent"></div>
      </section>

    </main>

    <aside class="timeline-rail" id="timelineRail" hidden>
      <p class="rail-label" id="railLabel"></p>
      <div class="rail-track" id="railTrack"></div>
    </aside>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
