<style>
  /* Stessa palette/token delle pagine interne (styles.css), ripetuti
     qui perche' index.html resta un file a se' stante, senza il
     resto dell'app (nessuna sidebar/side-rail, nessuno stato). */
  :root{
    color-scheme: dark;
    --bg:#000000;
    --text:#e7ebf3;
    --text-faint:#5b6478;
    --cyan:#ffffff;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(34,211,238,.08), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(232,121,249,.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
  }

  .home{
    display:flex; flex-direction:column; align-items:center;
    padding:24px;
  }
  .home-title{
    font-size:2.6rem; font-weight:800; letter-spacing:-.01em;
    color:var(--text); margin:0 0 56px;
    text-align:center;
  }

  .entries{
    display:flex; flex-direction:column; align-items:center; gap:40px;
  }
  a.entry{
    color:var(--text);
    text-decoration:none;
    font-size:1.4rem;
    letter-spacing:.04em;
    padding:14px 28px;
    border:1px solid var(--cyan);
    border-radius:999px;
    transition:color .2s ease;
  }
  a.entry:focus-visible{ color:#c7a25c; }
  @media (hover:hover){
    a.entry:hover{ color:#c7a25c; }
  }

  .home-note{
    margin-top:32px;
    color:var(--text-faint);
    font-size:.85rem;
    text-align:center;
  }

  /* Switch lingua — stessa forma a pillola delle altre pagine,
     stessa palette (var(--cyan)/var(--text-faint)) del resto del
     sito invece della precedente ambra/crema a se stante. */
  .lang-switch{
    position:fixed; top:24px; right:24px; z-index:20;
    display:flex; align-items:center; gap:6px;
    padding:9px 14px;
    border:1px solid var(--cyan);
    background:#0d1220;
    border-radius:999px;
    font-size:.78rem; font-weight:600;
    cursor:pointer;
  }
  .lang-option{ color:var(--text-faint); padding:2px 3px; transition:color .2s ease; }
  .lang-option.is-active{ color:var(--cyan); }
  .lang-sep{ color:#2a2e35; }

  /* Ko-fi + Discord + switch lingua, in alto. Fissa in alto come
     sempre (position:fixed, top:24px) — la larghezza pero' non e'
     piu' fissa/stretta al contenuto dei 3 pulsanti: viene misurata
     via JS dalla larghezza reale del blocco sotto (il pulsante piu'
     lungo tra i 5 .entry) e applicata qui come variabile, cosi'
     Discord parte al margine sinistro vero del contenuto e lo
     switch a quello destro, senza pero' spostare la barra dalla sua
     posizione in alto. */
  .top-controls{
    position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:20;
    width:var(--content-width, auto);
    display:flex; align-items:center; justify-content:space-between;
  }
  .lang-switch{ position:static; top:auto; right:auto; }
  .kofi-link{
    display:flex; align-items:center; gap:8px;
    padding:9px 16px;
    border:1px solid var(--cyan);
    background:#111726;
    border-radius:999px;
    font-size:.8rem; font-weight:600; color:var(--text-faint);
    text-decoration:none;
    transition:color .2s ease;
  }
  .kofi-link:hover{ color:var(--text); }
  .kofi-link svg{ width:16px; height:16px; color:#ef4444; flex-shrink:0; }
  .kofi-link__short{ display:none; }
  .discord-link{
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px;
    border:1px solid var(--cyan);
    background:#111726;
    border-radius:50%;
    color:var(--text-faint);
    text-decoration:none;
    transition:color .2s ease;
  }
  .discord-link:hover{ color:var(--text); }
  .discord-link svg{ width:18px; height:18px; }

  /* Mobile: stessa disposizione a barra piena delle altre home del
     sito (index-link/kofi-al-centro/switch), ma qui non c'e' un
     "torna all'index" (siamo gia' in home) quindi Discord prende
     quel posto a sinistra, e Ko-fi resta da solo al centro. */
  @media (hover:none) and (pointer:coarse){
    /* Home statica su mobile: mai scroll verticale della pagina.
       body e' gia' flex-centrato (regola di base), qui blocchiamo
       solo l'overflow — se il contenuto fosse mai troppo alto per
       schermi molto piccoli, viene tagliato invece di scorrere,
       mai un vero e proprio scroll su/giu'. */
    html, body{ overflow:hidden; height:100%; }
  }

  @media (hover:none) and (pointer:coarse){
    .top-controls{
      position:fixed; top:0; left:0; right:0; width:auto; transform:none;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px;
      background:var(--bg);
      border-bottom:1px solid #1f2738;
      gap:0;
    }
    .discord-link{ width:35px; height:35px; color:var(--cyan); }
    .kofi-link{
      position:absolute; left:50%; top:50%; transform:translate(-50%, -50%);
      height:35px; box-sizing:border-box;
      padding:0 13px; gap:6px;
    }
    .kofi-link__full{ display:none; }
    .kofi-link__short{ display:inline; color:var(--cyan); }
    .lang-switch{ height:35px; box-sizing:border-box; padding:0 11px; font-size:.79rem; }
  }

  /* Mobile: stessa home, pulsanti piu' piccoli di quanto non fossero
     su desktop (richiesto esplicitamente), titolo scalato di
     conseguenza. */
  @media (hover:none) and (pointer:coarse){
    .home{ padding-top:70px; }
    .home-title{ font-size:1.6rem; margin-bottom:32px; }
    .entries{ gap:24px; }
    a.entry{ font-size:1rem; padding:10px 20px; }
    .home-note{ margin-top:22px; font-size:.75rem; }
  }

  @media (hover:none) and (pointer:coarse) and (orientation:landscape){
    body::before{
      content:"Ruota il dispositivo in verticale per continuare.";
      position:fixed; inset:0; z-index:9999;
      display:flex; align-items:center; justify-content:center;
      padding:40px; text-align:center;
      background:#000000; color:#e8e2d0;
      font-family:var(--font);
      font-size:1rem; line-height:1.6;
    }
    html[lang="en"] body::before{
      content:"Please rotate your device back to portrait to continue.";
    }
  }
</style>
</head>

  <script>
    const langSwitch = document.getElementById("langSwitch");
    const titleEl = document.querySelector(".home-title");
    const LANG_KEY = "tfs-lang";
    const storedLang = localStorage.getItem(LANG_KEY);
    let lang = (storedLang === "it" || storedLang === "en") ? storedLang : "en";

    function paintLang(){
      document.documentElement.lang = lang;
      document.querySelectorAll(".entry, .home-title, .kofi-link__full, .home-note").forEach(el => {
        el.textContent = el.dataset[lang];
      });
      langSwitch.querySelectorAll(".lang-option").forEach(opt => {
        opt.classList.toggle("is-active", opt.dataset.langOption === lang);
      });
      syncTopControlsWidth();
    }

    // La barra dei 3 pulsanti in alto e' fissa in posizione, ma larga
    // esattamente quanto il titolo sotto (non i 5 pulsanti-voce, che
    // possono anche essere più larghi): Discord parte dove inizia il
    // titolo, lo switch dove finisce, Ko-fi in mezzo. Rimisurata dopo
    // ogni cambio lingua (il testo del titolo resta uguale nelle due
    // lingue in questo caso, ma per coerenza/sicurezza futura) e a
    // ogni resize della finestra.
    function syncTopControlsWidth(){
      if(!titleEl) return;
      const width = titleEl.getBoundingClientRect().width;
      document.documentElement.style.setProperty("--content-width", width + "px");
    }
    window.addEventListener("resize", syncTopControlsWidth);

    langSwitch.addEventListener("click", () => {
      lang = lang === "it" ? "en" : "it";
      localStorage.setItem(LANG_KEY, lang);
      paintLang();
    });

    paintLang();

    // ---------------------------------------------------------
    // Suono UI al tap, stesso comportamento delle altre pagine.
    // Niente index-link qui (e' la home stessa), ne' skip brano da
    // escludere (niente musica su questa pagina).
    // ---------------------------------------------------------
    const TAP_SOUND_URL = "https://pub-de8310383cdb437f8f0b585a6642e88e.r2.dev/Tap.mp3";
    document.addEventListener("click", (e) => {
      if(e.target.closest("button, a.kofi-link, a.discord-link, a.entry")){
        const tap = new Audio(TAP_SOUND_URL);
        tap.volume = window.matchMedia("(hover:none) and (pointer:coarse)").matches ? 0.3 : 0.1;
        tap.play().catch(() => { /* bloccato finché non c'è un gesto utente; il click stesso lo è, quindi è solo un fallback */ });
      }
    });

    // I 5 pulsanti principali navigano verso le altre pagine: senza
    // un piccolo ritardo il browser cambia pagina prima che il suono
    // del tap (gia' gestito qui sopra) faccia in tempo a partire.
    document.querySelectorAll("a.entry").forEach(link => {
      link.addEventListener("click", (ev) => {
        ev.preventDefault();
        setTimeout(() => { window.location.href = link.href; }, 550);
      });
    });

  </script>
