<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Forgotten Shelf</title>
<style>
  html,body{
    height:100%; margin:0;
    background:#0b0d10;
    color-scheme: dark;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .entries{
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  a.entry{
    color:#e8e2d0;
    text-decoration:none;
    font-size:1.4rem;
    letter-spacing:.04em;
    padding:14px 28px;
    border:1px solid #ffffff; /* bianco fisso, come i pulsanti nelle
      home delle altre pagine (var(--cyan), che li' vale bianco) */
    border-radius:999px;
    transition:color .2s ease;
  }
  a.entry:focus-visible{
    color:#c7a25c;
  }
  /* Stesso criterio usato nel resto del sito: l'hover si attiva solo
     sui dispositivi che hanno davvero un puntatore (mouse), non sul
     touch — dove :hover senza questa guardia resterebbe "incollato"
     dopo un tap finché non se ne tocca un altro. */
  @media (hover:hover){
    a.entry:hover{
      color:#c7a25c;
    }
  }

  /* Switch lingua — stessa forma a pillola delle altre pagine, ma
     con la palette propria di questa pagina (ambra/crema) invece
     del ciano usato altrove, per restare coerente con lo stile
     già presente qui. Angolo in alto a destra, sempre visibile. */
  .lang-switch{
    position:fixed; top:24px; right:24px; z-index:20;
    display:flex; align-items:center; gap:6px;
    padding:9px 14px;
    border:1px solid #ffffff; /* bianco fisso, come lo switch lingua
      nelle altre pagine (var(--cyan), che li' vale bianco) */
    background:#14161b;
    border-radius:999px;
    font-size:.78rem; font-weight:600;
    cursor:pointer;
  }
  .lang-option{ color:#6b6b6b; padding:2px 3px; transition:color .2s ease; }
  .lang-option.is-active{ color:#c7a25c; }
  .lang-sep{ color:#2a2e35; }

  /* Stesso blocco orientamento orizzontale delle altre pagine (qui
     non condivide styles.css, quindi ripetuto), ora bilingue come
     nelle altre pagine (html[lang] è lo stesso meccanismo condiviso). */
  @media (hover:none) and (pointer:coarse) and (orientation:landscape){
    body::before{
      content:"Ruota il dispositivo in verticale per continuare.";
      position:fixed; inset:0; z-index:9999;
      display:flex; align-items:center; justify-content:center;
      padding:40px; text-align:center;
      background:#0b0d10; color:#e8e2d0;
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size:1rem; line-height:1.6;
    }
    html[lang="en"] body::before{
      content:"Please rotate your device back to portrait to continue.";
    }
  }
</style>
</head>
<body>
  <button class="lang-switch" id="langSwitch" type="button" aria-label="Cambia lingua / Change language">
    <span class="lang-option is-active" data-lang-option="it">IT</span>
    <span class="lang-sep">/</span>
    <span class="lang-option" data-lang-option="en">EN</span>
  </button>

  <div class="entries">
    <a class="entry" href="timeline.html" data-it="Timeline" data-en="Timeline">Timeline</a>
    <a class="entry" href="storie.html" data-it="Storie & Teorie" data-en="Theories & Hidden Stories">Storie & Teorie</a>
    <a class="entry" href="racconti.html" data-it="Racconti" data-en="Short Stories & Books">Racconti</a>
    <a class="entry" href="officina.html" data-it="Officina" data-en="Workshop">Officina</a>
    <a class="entry" href="recensioni.html" data-it="Recensioni" data-en="Reviews">Recensioni</a>
  </div>

  <script>
    const langSwitch = document.getElementById("langSwitch");
    let lang = "it";
    langSwitch.addEventListener("click", () => {
      lang = lang === "it" ? "en" : "it";
      document.documentElement.lang = lang;
      document.querySelectorAll(".entry").forEach(el => {
        el.textContent = el.dataset[lang];
      });
      langSwitch.querySelectorAll(".lang-option").forEach(opt => {
        opt.classList.toggle("is-active", opt.dataset.langOption === lang);
      });
    });
  </script>
</body>
</html>
