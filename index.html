<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Forgotten Shelf</title>
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/inter.css">
<style>
  /* Stessa palette/token delle pagine interne (styles.css), ripetuti
     qui perche' index.html resta un file a se' stante, senza il
     resto dell'app (nessuna sidebar/side-rail, nessuno stato). */
  :root{
    color-scheme: dark;
    --bg:#000000;
    --text:#e7ebf3;
    --text-faint:#5b6478;
    --cyan:#ffffff;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(34,211,238,.08), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(232,121,249,.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
  }

  .home{
    display:flex; flex-direction:column; align-items:center;
    padding:24px;
  }
  .home-title{
    font-size:2.6rem; font-weight:800; letter-spacing:-.01em;
    color:var(--text); margin:0 0 40px;
    text-align:center;
  }

  .entries{
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  a.entry{
    color:var(--text);
    text-decoration:none;
    font-size:1.4rem;
    letter-spacing:.04em;
    padding:14px 28px;
    border:1px solid var(--cyan);
    border-radius:999px;
    transition:color .2s ease;
  }
  a.entry:focus-visible{ color:#c7a25c; }
  @media (hover:hover){
    a.entry:hover{ color:#c7a25c; }
  }

  /* Switch lingua — stessa forma a pillola delle altre pagine,
     stessa palette (var(--cyan)/var(--text-faint)) del resto del
     sito invece della precedente ambra/crema a se stante. */
  .lang-switch{
    position:fixed; top:24px; right:24px; z-index:20;
    display:flex; align-items:center; gap:6px;
    padding:9px 14px;
    border:1px solid var(--cyan);
    background:#0d1220;
    border-radius:999px;
    font-size:.78rem; font-weight:600;
    cursor:pointer;
  }
  .lang-option{ color:var(--text-faint); padding:2px 3px; transition:color .2s ease; }
  .lang-option.is-active{ color:#c7a25c; }
  .lang-sep{ color:#2a2e35; }

  /* Mobile: stessa home, pulsanti piu' piccoli di quanto non fossero
     su desktop (richiesto esplicitamente), titolo scalato di
     conseguenza. */
  @media (hover:none) and (pointer:coarse){
    .home-title{ font-size:1.6rem; margin-bottom:28px; }
    .entries{ gap:12px; }
    a.entry{ font-size:1rem; padding:10px 20px; }
  }

  @media (hover:none) and (pointer:coarse) and (orientation:landscape){
    body::before{
      content:"Ruota il dispositivo in verticale per continuare.";
      position:fixed; inset:0; z-index:9999;
      display:flex; align-items:center; justify-content:center;
      padding:40px; text-align:center;
      background:#000000; color:#e8e2d0;
      font-family:var(--font);
      font-size:1rem; line-height:1.6;
    }
    html[lang="en"] body::before{
      content:"Please rotate your device back to portrait to continue.";
    }
  }
</style>
</head>
<body>
  <button class="lang-switch" id="langSwitch" type="button" aria-label="Cambia lingua / Change language">
    <span class="lang-option is-active" data-lang-option="it">IT</span>
    <span class="lang-sep">/</span>
    <span class="lang-option" data-lang-option="en">EN</span>
  </button>

  <div class="home">
    <h1 class="home-title" data-it="The Forgotten Shelf" data-en="The Forgotten Shelf">The Forgotten Shelf</h1>

    <div class="entries">
      <a class="entry" href="racconti.html" data-it="📖 Storie Senza Cornice 📖" data-en="📖 Unframed Stories 📖">📖 Storie Senza Cornice 📖</a>
      <a class="entry" href="timeline.html" data-it="⏳ La Traccia del Tempo ⏳" data-en="⏳ The Trace of Time ⏳">⏳ La Traccia del Tempo ⏳</a>
      <a class="entry" href="storie.html" data-it="🧩 Il Filo Nascosto 🧩" data-en="🧩 The Hidden Thread 🧩">🧩 Il Filo Nascosto 🧩</a>
      <a class="entry" href="recensioni.html" data-it="🎮 Diari di Gioco 🎮" data-en="🎮 Game Diaries 🎮">🎮 Diari di Gioco 🎮</a>
      <a class="entry" href="officina.html" data-it="🔧 L'Officina Grezza 🔧" data-en="🔧 The Raw Workshop 🔧">🔧 L'Officina Grezza 🔧</a>
    </div>
  </div>

  <script>
    const langSwitch = document.getElementById("langSwitch");
    let lang = "it";
    langSwitch.addEventListener("click", () => {
      lang = lang === "it" ? "en" : "it";
      document.documentElement.lang = lang;
      document.querySelectorAll(".entry, .home-title").forEach(el => {
        el.textContent = el.dataset[lang];
      });
      langSwitch.querySelectorAll(".lang-option").forEach(opt => {
        opt.classList.toggle("is-active", opt.dataset.langOption === lang);
      });
    });
  </script>
</body>
</html>
