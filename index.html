<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Forgotten Shelf</title>
<style>
  html,body{
    height:100%; margin:0;
    background:#0b0d10;
    color-scheme: dark;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .entries{
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  a.entry{
    color:#e8e2d0;
    text-decoration:none;
    font-size:1.4rem;
    letter-spacing:.04em;
    padding:14px 28px;
    border:1px solid #2a2e35;
    border-radius:999px;
    transition:border-color .2s ease, color .2s ease;
  }
  a.entry:focus-visible{
    border-color:#a9863f;
    color:#c7a25c;
  }
  /* Stesso criterio usato nel resto del sito: l'hover si attiva solo
     sui dispositivi che hanno davvero un puntatore (mouse), non sul
     touch — dove :hover senza questa guardia resterebbe "incollato"
     dopo un tap finché non se ne tocca un altro. */
  @media (hover:hover){
    a.entry:hover{
      border-color:#a9863f;
      color:#c7a25c;
    }
  }
</style>
</head>
<body>
  <div class="entries">
    <a class="entry" href="timeline.html">Timeline</a>
    <a class="entry" href="storie.html">Storie & Teorie</a>
    <a class="entry" href="racconti.html">Racconti</a>
    <a class="entry" href="officina.html">Officina</a>
  </div>
</body>
</html>
