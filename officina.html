<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officina</title>
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/inter.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="officina.css">
</head>
<body data-state="landing" data-lang="it">

  <div class="layout">
    <main class="stage" id="stage">

      <div class="stage-topbar">
        <div class="brand" id="brandBlock">
          <a class="brand-icon" href="https://ko-fi.com/the_forgotten_shelf" target="_blank" rel="noopener" aria-label="Sostienimi su Ko-fi">
            <span class="seal seal--mini" aria-hidden="true">
              <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 12h14v9a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5v-9z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
                <path d="M22 14h2.5a3.5 3.5 0 0 1 0 7H22" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M12 8.5c0-1.2 1.6-1.2 1.6-2.4M17 8.5c0-1.2 1.6-1.2 1.6-2.4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </span>
          </a>
          <button class="brand-text" id="brandBtn" type="button" data-i18n="brand" aria-label="Torna alla home">Officina</button>
        </div>

        <a class="index-link" href="index.html">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2L2 9h2v8h5v-5h2v5h5V9h2L10 2z" fill="currentColor"/></svg>
          <span data-i18n="backToIndexLabel">Torna all'index</span>
        </a>

        <div class="stage-controls">
          <a class="kofi-link" href="https://ko-fi.com/the_forgotten_shelf" target="_blank" rel="noopener">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17.5s-6.5-4-8.2-8.1C.5 6.5 2 3.5 5 3.2c1.8-.2 3.4.7 4.3 2 .9-.3 1.6-1.2 3-2C15.5 2 18.8 4 18 8c-1 4.2-8 9.5-8 9.5z" fill="currentColor"/></svg>
            <span class="kofi-link__full" data-i18n="kofiLabel">Sostienimi su Ko-fi</span>
            <span class="kofi-link__short">KoFi</span>
          </a>

          <button class="lang-switch" id="langSwitch" type="button" aria-label="Cambia lingua / Change language">
            <span class="lang-option is-active" data-lang-option="it">IT</span>
            <span class="lang-sep">/</span>
            <span class="lang-option" data-lang-option="en">EN</span>
          </button>
        </div>
      </div>

      <div class="mathemory-pin" id="mathemoryPin">
        <span class="mathemory-pin__spilla" aria-hidden="true"></span>
        <span class="mathemory-pin__corner mathemory-pin__corner--tl" aria-hidden="true"></span>
        <span class="mathemory-pin__corner mathemory-pin__corner--tr" aria-hidden="true"></span>
        <span class="mathemory-pin__corner mathemory-pin__corner--bl" aria-hidden="true"></span>
        <span class="mathemory-pin__corner mathemory-pin__corner--br" aria-hidden="true"></span>
        <div class="mathemory-pin__cover" aria-hidden="true">anteprima in arrivo</div>
        <span class="mathemory-pin__label">Mathemory</span>
      </div>

      <section class="landing" id="landingPanel">
        <p class="landing-eyebrow" data-i18n="landingEyebrow">Benvenuto nell'officina</p>
        <h1 class="landing-title" data-i18n="landingTitle">The Forgotten Shelf</h1>
        <p class="landing-intro" data-i18n="landingIntro">
          The Forgotten Shelf raccoglie anche i progetti che vivono altrove: giochi e strumenti in lavorazione, collegati da qui.
        </p>

        <p class="landing-sub" data-i18n="landingSub">(contenuto in arrivo)</p>
      </section>

    </main>
  </div>

  <script src="script-officina.js"></script>
</body>
</html>
