<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test riproduzione bug scroll</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; }

  /* ============================================================
     Stessa identica struttura della pagina vera: .layout scorre
     orizzontalmente con scroll-snap-type:x mandatory, tre pannelli
     dentro (sidebar | stage | side-rail), ciascuno largo quanto lo
     schermo su mobile. Nessun contenuto vero, solo blocchi colorati
     con scritte enormi per capire a colpo d'occhio quale pannello e'
     visibile dopo il refresh.
     ============================================================ */
  .layout{
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    height: 100vh;
  }
  .panel{
    flex: 0 0 100vw;
    width: 100vw;
    height: 100vh;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10vw;
    font-weight: 900;
    color: #fff;
    text-align: center;
  }
  #sidebar{ background: #c0392b; } /* rosso: se vedi questo dopo il refresh, il bug si riproduce anche qui */
  #stage{ background: #27ae60; }   /* verde: questo e' quello che DEVE vedersi dopo il refresh */
  #rail{ background: #2980b9; }

  #log{
    position: fixed; top: 10px; left: 10px; right: 10px;
    background: rgba(0,0,0,.8); color: #0f0;
    font-family: monospace; font-size: 12px;
    padding: 10px; border-radius: 8px;
    z-index: 999; max-height: 40vh; overflow-y: auto;
  }
</style>
</head>
<body>

<div id="log"></div>

<div class="layout" id="layout">
  <div class="panel" id="sidebar">SIDEBAR<br>(non deve<br>restare qui<br>dopo refresh)</div>
  <div class="panel" id="stage">STAGE<br>(HOME —<br>deve essere<br>qui dopo refresh)</div>
  <div class="panel" id="rail">SIDE-RAIL</div>
</div>

<script>
  // Log visibile in pagina, utile su telefono dove non c'e' la
  // console degli sviluppatori a portata di mano.
  function log(msg){
    var el = document.getElementById("log");
    el.innerHTML += msg + "<br>";
  }

  log("Boot iniziato. scrollRestoration prima: " + (history.scrollRestoration || "non supportato"));

  // Stessa identica tecnica appena messa sulla pagina vera.
  if("scrollRestoration" in history){
    history.scrollRestoration = "manual";
    log("scrollRestoration impostato a manual.");
  }

  var layoutEl = document.getElementById("layout");
  var stageEl = document.getElementById("stage");

  function scrollToStage(){
    var pos = stageEl.offsetLeft;
    layoutEl.scrollLeft = pos;
    log("scrollLeft impostato a " + pos + " (offsetLeft dello stage). Risultato reale: " + layoutEl.scrollLeft);
  }

  scrollToStage();
  setTimeout(scrollToStage, 50);
  setTimeout(scrollToStage, 300);
  window.addEventListener("load", function(){
    log("Evento load sparato.");
    scrollToStage();
  });

  // Log finale dopo un secondo, per vedere se qualcosa e' cambiato
  // la posizione DOPO tutti i nostri tentativi (es. un ripristino
  // nativo del browser arrivato in ritardo).
  setTimeout(function(){
    log("--- Controllo finale a 1000ms: scrollLeft = " + layoutEl.scrollLeft + " (0 = sidebar, " + stageEl.offsetLeft + " = stage/home) ---");
  }, 1000);

  // Bottone per navigare "dentro" (simula apertura di una voce) cosi'
  // si puo' scorrere verso una tabella, poi tornare indietro/ricarica
  // per testare il refresh da uno stato diverso dalla home.
  var btn = document.createElement("button");
  btn.textContent = "Scorri verso Sidebar (poi ricarica la pagina)";
  btn.style.cssText = "position:fixed;bottom:10px;left:10px;right:10px;padding:15px;font-size:16px;z-index:999;";
  btn.onclick = function(){ layoutEl.scrollLeft = 0; };
  document.body.appendChild(btn);
</script>

</body>
</html>
