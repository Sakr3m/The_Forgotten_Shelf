<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storie Teste</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: sans-serif;
    color: #fff;
  }

  /* Il carosello: tre schermate affiancate, larghe quanto lo schermo,
     che scorrono in orizzontale. "home" e' quella centrale (seconda
     nell'ordine), quindi e' quella visibile di default all'apertura -
     "racconti" si raggiunge scorrendo a sinistra, "libri" scorrendo
     a destra. */
  .carosello {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    height: 100vh;
    width: 100vw;
  }
  .schermata {
    flex: 0 0 100vw;
    width: 100vw;
    height: 100vh;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #racconti { background: #1b3a2f; }
  #home     { background: #1a1a2e; }
  #libri    { background: #3a1b2f; }

  h1 {
    font-size: 2.5rem;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="carosello" id="carosello">

    <div class="schermata" id="racconti">
      <h1>Racconti</h1>
    </div>

    <div class="schermata" id="home">
      <h1>Home</h1>
    </div>

    <div class="schermata" id="libri">
      <h1>Libri</h1>
    </div>

  </div>

  <script>
    // All'apertura, porta subito la vista sulla schermata "home"
    // (quella centrale) invece di partire da "racconti" (la prima
    // nell'ordine, dove il carosello si troverebbe di default).
    var caroselloEl = document.getElementById("carosello");
    var homeEl = document.getElementById("home");
    caroselloEl.scrollLeft = homeEl.offsetLeft;
  </script>

</body>
</html>
